name: Cartes de statistiques

# Génère les cartes du README dans le dossier profile/, une fois par jour
# (ou à la main depuis l'onglet Actions).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

jobs:
  cartes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Stats (thème sombre)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=stars,prs&hide_rank=true&disable_animations=true&hide_border=true&locale=fr&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats (thème clair)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=stars,prs&hide_rank=true&disable_animations=true&hide_border=true&locale=fr
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Langages (thème sombre)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=hack&disable_animations=true&hide_border=true&locale=fr&theme=github_dark
          path: profile/langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Langages (thème clair)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=hack&disable_animations=true&hide_border=true&locale=fr
          path: profile/langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enregistrer les cartes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: mise à jour des cartes de statistiques" || exit 0
          git push
